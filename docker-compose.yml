x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── PostgreSQL Database ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jobboard-db
    environment:
      POSTGRES_DB:            ${POSTGRES_DB:-jobboard}
      POSTGRES_USER:          ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - jobboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jobboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ── Jobs Microservice (Python / FastAPI) ───────────────────────
  jobs-service:
    build:
      context: ./jobs-service
      dockerfile: Dockerfile
    container_name: jobs-service
    environment:
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     "5432"
      POSTGRES_DB:       ${POSTGRES_DB:-jobboard}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobboard-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ── Applications Microservice (Node.js / Express) ──────────────
  applications-service:
    build:
      context: ./applications-service
      dockerfile: Dockerfile
    container_name: applications-service
    environment:
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     "5432"
      POSTGRES_DB:       ${POSTGRES_DB:-jobboard}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PORT: 3001
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobboard-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ── React Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobboard-frontend
    networks:
      - jobboard-network
    depends_on:
      jobs-service:
        condition: service_healthy
      applications-service:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ── Nginx Reverse Proxy (single external entry-point) ──────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-proxy
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_healthy
      jobs-service:
        condition: service_healthy
      applications-service:
        condition: service_healthy
    networks:
      - jobboard-network
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

# ── Named Volumes ──────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
    name: jobboard-postgres-data

# ── Networks ───────────────────────────────────────────────────
networks:
  jobboard-network:
    driver: bridge
    name: jobboard-network

# ── Docker Secrets ──────────────────────────────────────────────
secrets:
  db_password:
    file: ./secrets/db_password.txt

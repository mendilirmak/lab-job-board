# ============================================================
# HorizontalPodAutoscaler
#
# Requires: metrics-server installed in the cluster
#   minikube addons enable metrics-server
#   OR: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# Each autoscaler targets CPU utilisation.
# When average CPU across all pods exceeds 60% it scales up,
# when it drops below it scales back down (with a 5-min cooldown).
# ============================================================

# ── Jobs Service HPA ─────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jobs-service-hpa
  namespace: jobboard
  labels:
    app.kubernetes.io/name: jobs-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jobs-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type:          Pods
          value:         2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type:          Pods
          value:         1
          periodSeconds: 120

---
# ── Applications Service HPA ─────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
